# ===========================================================================
# 四种勾选组合的配置回归检查
#
# 只用十几分钟，不编译。做的是：
#   取源码 → 装 feed → 四个组合各拼一次 .config → 逐项双向断言
#
# 为什么值得单独开一个工作流：
#   全量编译一次两三个小时，没人会在每次改动时都跑；而「某个组合悄悄编错了
#   包」这类问题在 .config 阶段就能发现 —— 只要断言写得够严。
#   真正的固件构建仍然走 build-x86_64.yml。
#
# 什么时候跑：
#   * 改了 config/ 、scripts/ 、feeds.conf.append 或 vendor/ 时 ——
#     这些正是会改变包集合的东西；
#   * 手动触发。
#
# 纯文档改动不触发，省得白跑。
# ===========================================================================
name: 配置回归检查

on:
  push:
    branches: [main]
    paths:
      - 'config/**'
      - 'scripts/**'
      - 'vendor/**'
      - 'overlay/**'
      - 'patches/**'
      - 'feeds.conf.append'
      - 'build.sh'
      - '.github/workflows/check-combos.yml'
  pull_request:
    paths:
      - 'config/**'
      - 'scripts/**'
      - 'vendor/**'
      - 'overlay/**'
      - 'patches/**'
      - 'feeds.conf.append'
      - 'build.sh'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: check-combos-${{ github.ref }}
  cancel-in-progress: true

jobs:
  combos:
    name: 四种组合 × 配置断言
    runs-on: ubuntu-24.04
    # 只有 feed 下载 + 四次 defconfig，给足余量也用不到这么多。
    timeout-minutes: 60

    env:
      CURL_OPTIONS: --speed-limit 51200 --speed-time 60

    steps:
      - name: 检出代码
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: 释放磁盘空间
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android \
            /usr/local/share/boost /opt/ghc /opt/hostedtoolcache/CodeQL \
            /usr/share/swift /usr/local/.ghcup /opt/az /usr/lib/jvm || true
          sudo apt-get clean
          df -h /

      - name: 安装依赖
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential clang flex bison g++ gawk gettext \
            git libncurses-dev libssl-dev python3-setuptools \
            rsync swig unzip zlib1g-dev file wget time patch

      # dl/ 缓存：feed 索引与部分源码包的下载能省不少时间。
      # key 跟着 feeds.conf.append 走 —— 它变了才说明包来源变了。
      - name: 缓存源码包
        uses: actions/cache@v4
        with:
          path: openwrt/dl
          key: dl-${{ hashFiles('feeds.conf.append') }}
          restore-keys: |
            dl-

      - name: 四种组合逐一核对
        run: ./scripts/check-all-combos.sh

      - name: 失败时把 .config 与期望清单传上来
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: failed-config
          path: |
            .generated/
          if-no-files-found: warn
          retention-days: 7
