# ===========================================================================
# 上游清单 —— 本项目跟踪哪些仓库、跟踪到哪、怎么消费
#
# 这是**唯一的事实来源**。build.sh、scripts/01-fetch.sh、
# scripts/check-upstream.sh、scripts/sync-vendor.sh 都读它，
# 不再各自写死一个 ref。改上游版本只改这里一处。
#
# 格式：KEY=VALUE，普通 shell 取值语法（. 一下就能用）。
#
# ---------------------------------------------------------------------------
# 三种消费方式，决定了「上游更新后我们要不要动手」
# ---------------------------------------------------------------------------
#
#   fetch   构建时现拉源码，**永远是最新的**，我们什么都不用做。
#   feed    构建时 feeds update 拉分支最新，**内容自动更新**；
#           但 feed 里新增的、我们没选中的包不会自己进来。
#   vendor  代码收录在 vendor/ 里。**上游更新不会自己进来**，
#           需要 scripts/check-upstream.sh 发现 + 人工 review 后同步。
#
# 所以「上游有新特性我们能不能跟上」这件事，三种情况答案不同：
#   ImmortalWrt  → 自动跟（fetch）
#   iStoreOS 侧  → 已选包的内容自动跟（feed）
#   FanchmWrt    → 需要一次 review 过的同步（vendor）
#                  这个是 .github/workflows/upstream-watch.yml 的职责
#
# ---------------------------------------------------------------------------

# --- 底座：构建时现拉，永远最新 ---------------------------------------------
IMMORTALWRT_REPO=immortalwrt/immortalwrt
# 跟分支而不是锁 tag：稳定分支会持续收 bug 修复，这正是我们要的。
# 想锁定某个版本保证可复现，把这里换成 tag（如 v25.12.2）即可。
IMMORTALWRT_REF=openwrt-25.12

# --- FanchmWrt：vendored，需要同步 ------------------------------------------
FANCHMWRT_REPO=fanchmwrt/fanchmwrt
# 上游按 OpenWrt 版本开分支，形如 fanchmwrt-25.12.4。
# ⚠️ 上游升到 25.12.5 或换内核时，vendor 过来的内核补丁（950-fwx-*）可能
#    需要重新适配 —— check-upstream.sh --deep 会验证它是否仍能应用。
FANCHMWRT_REF=fanchmwrt-25.12.4

FANCHMWRT_PACKAGES_REPO=fanchmwrt/fanchmwrt-packages
FANCHMWRT_PACKAGES_REF=main

# ---------------------------------------------------------------------------
# feed 类上游不在这里列 —— 它们的 ref 写在 feeds.conf.append 里，
# 那是构建时真正被读取的地方。在这里重复一份只会让两边慢慢对不上。
# check-upstream.sh 会解析 feeds.conf.append 来跟踪它们。
# ---------------------------------------------------------------------------
